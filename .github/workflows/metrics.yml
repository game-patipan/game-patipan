name: Metrics

on:
  schedule:
    - cron: "17 2 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/metrics.yml
      - .github/metrics/**
      - README.md

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Commit counts per hour / weekday for the "Coding habits" charts
      - name: Compute coding habits
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          TZ_OFFSET_HOURS: "7"
        run: node .github/metrics/habits.mjs > "$RUNNER_TEMP/habits.js" || : > "$RUNNER_TEMP/habits.js"

      # Habits charts, skills and the two-column layout injected into the render (see scripts/generate-skills.mjs)
      - name: Load extras script
        id: skills
        run: |
          {
            echo "js<<__SKILLS_JS__"
            cat "$RUNNER_TEMP/habits.js" .github/metrics/skills.js
            echo "__SKILLS_JS__"
          } >> "$GITHUB_OUTPUT"

      - uses: lowlighter/metrics@latest
        with:
          # Personal access token (classic) stored as the METRICS_TOKEN repository secret
          token: ${{ secrets.METRICS_TOKEN }}
          # No `user:` input: metrics uses the token owner, so this keeps working after a username change
          filename: metrics.svg
          template: classic
          base: header, repositories
          config_order: base.header, base.repositories, isocalendar, languages
          config_timezone: Asia/Bangkok
          config_padding: 0 # skills.js sizes the two-column 960px layout itself
          # plugin_habits is replaced by habits.mjs: it crashes on GitHub's current push event payloads.
          # plugin_lines is left out: it can stall for minutes and then crash the whole render.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 8
          extras_js: ${{ steps.skills.outputs.js }}
