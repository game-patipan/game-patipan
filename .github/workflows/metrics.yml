name: Metrics

on:
  schedule:
    - cron: "17 2 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/metrics.yml
      - .github/metrics/**

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skills section + two-column layout injected into the render (generated by `npm run skills`)
      - name: Load skills section
        id: skills
        run: |
          {
            echo "js<<__SKILLS_JS__"
            cat .github/metrics/skills.js
            echo "__SKILLS_JS__"
          } >> "$GITHUB_OUTPUT"

      - uses: lowlighter/metrics@latest
        with:
          # Personal access token (classic) stored as the METRICS_TOKEN repository secret
          token: ${{ secrets.METRICS_TOKEN }}
          user: gamegreanai
          filename: metrics.svg
          template: classic
          base: header, repositories
          config_order: base.header, base.repositories, lines, habits, isocalendar, languages
          config_timezone: Asia/Bangkok
          config_padding: 0 # skills.js sizes the two-column 960px layout itself
          plugin_lines: yes
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: no
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 8
          extras_js: ${{ steps.skills.outputs.js }}
